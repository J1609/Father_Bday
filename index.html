<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday, Baba &mdash; The Collector's Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Dancing+Script:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  html, body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#2b2420; }
  .preview-frame{
    position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; margin:0; overflow:hidden;
    background: linear-gradient(160deg, #F6EFE1 0%, #E9D4A9 45%, #C7A76B 100%);
    font-family:'EB Garamond', serif; color:#3A2E20;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .preview-frame *{ box-sizing:border-box; }
  .app{ position:relative; z-index:1; height:100%; width:100%; overflow:hidden; }

  .mag-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; }
  .mag-hint{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:20;
    font-family:'Dancing Script', cursive; font-size:16px; color:#3A2E20; text-align:center;
    background:rgba(255,251,242,.9); padding:6px 16px; border-radius:999px;
    box-shadow:0 4px 10px rgba(58,46,32,.22); pointer-events:none; white-space:nowrap;
    transition:opacity .6s ease; max-width:88vw; overflow:hidden; text-overflow:ellipsis;
  }
  .mag-hint.hide{ opacity:0; }

  /* book aspect ratio tuned to the magazine's own page ratio (~0.694) */
  :root{ --book-w: min(92vw, 82vh * 0.694); --book-h: min(82vh, 92vw * 1.4409); }
  .book{ position:relative; width:var(--book-w); height:var(--book-h); perspective:1800px; }

  .mag-page{
    position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    transition:transform .85s cubic-bezier(.45,.05,.55,.95);
    border-radius:10px; overflow:hidden; box-shadow:0 12px 34px rgba(58,46,32,.35);
    background: linear-gradient(160deg, #F6EFE1 0%, #E9D4A9 45%, #C7A76B 100%);
  }
  .mag-page.flipped{ transform:rotateY(-178deg); }
  .page-corner{
    position:absolute; right:0; bottom:0; width:26%; height:18%; cursor:pointer; z-index:5;
    background:linear-gradient(135deg, transparent 55%, rgba(58,46,32,.10) 60%, rgba(58,46,32,.20) 100%);
    border-bottom-right-radius:10px;
  }
  .mag-page.flipped .page-corner{ pointer-events:none; }
  .mag-page-shade{ position:absolute; inset:0; background:linear-gradient(90deg, rgba(0,0,0,0) 70%, rgba(0,0,0,.30) 100%); opacity:0; transition:opacity .85s ease; pointer-events:none; }
  .mag-page.flipped .mag-page-shade{ opacity:1; }

  .mag-restart{
    position:fixed; top:calc(18px + env(safe-area-inset-top)); left:calc(18px + env(safe-area-inset-left)); z-index:2001;
    width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.92); color:#3A2E20; font-size:17px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(58,46,32,.3); cursor:pointer;
  }

  /* ---------- shared page content ---------- */
  .pg{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .pg .art-wrap{ position:relative; display:inline-block; line-height:0; }
  /* sized against the same definite vh/vw formula as .book itself (not a % of this
     inline-block, which has no definite size of its own) so it can never overflow
     the page and clip -- that overflow was throwing off the song hotspot alignment */
  .pg .art-wrap img{ display:block; max-width:var(--book-w); max-height:var(--book-h); width:auto; height:auto; margin:0 auto; }

  .pageno{ position:absolute; bottom:14px; left:20px; font-size:10px; letter-spacing:.2em; color:#7A5A2E; z-index:3; }
  .back-to-cover{
    position:absolute; bottom:14px; left:20px; font-family:'Dancing Script', cursive; font-size:15px;
    color:#7A5A2E; z-index:6; cursor:pointer; background:rgba(255,251,242,.85); padding:4px 12px; border-radius:999px;
  }

  /* --- songs page hotspots --- */
  .hotspot{
    position:absolute; width: 6.2%; aspect-ratio: 1 / 1; transform: translate(-50%, -50%);
    border-radius: 50%; border: none; background: transparent; cursor: pointer; padding: 0; z-index:4;
  }
  .hotspot .ring{
    position:absolute; inset: -18%; border-radius: 50%; border: 2px solid #FBEFD2; opacity: 0; transform: scale(0.85);
  }
  .hotspot.playing .ring{ opacity: 0.95; animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse{
    0%{ transform: scale(0.8); opacity: 0.95; }
    70%{ transform: scale(1.35); opacity: 0; }
    100%{ transform: scale(1.35); opacity: 0; }
  }

  .now-playing{
    position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    z-index: 2002; background: rgba(42,33,22,0.92); border: 1px solid rgba(255,255,255,.18); color: #FBF5E9;
    padding: 9px 18px; border-radius: 999px; font-family:'EB Garamond', serif; font-size: 13.5px;
    letter-spacing: 0.3px; display: flex; align-items: center; gap: 10px;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .now-playing.show{ opacity: 1; pointer-events:auto; }
  .now-playing .eq{ display:flex; gap:2px; align-items:flex-end; height:12px; }
  .now-playing .eq i{ width:2.5px; background:#E9D4A9; display:block; border-radius:1px; animation: eq 0.9s ease-in-out infinite; }
  .now-playing .eq i:nth-child(1){ height:40%; animation-delay:0s; }
  .now-playing .eq i:nth-child(2){ height:100%; animation-delay:.2s; }
  .now-playing .eq i:nth-child(3){ height:65%; animation-delay:.4s; }
  @keyframes eq{ 0%,100%{ transform: scaleY(0.4); } 50%{ transform: scaleY(1); } }

  @media (min-width: 900px){
    :root{ --book-w: min(60vw, 82vh * 0.694); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="preview-frame">
  <button class="mag-restart" onclick="resetBook()" aria-label="Back to cover">&#8635;</button>
  <div class="app">
    <div class="mag-wrap">
      <p class="mag-hint" id="magHint">flip through Baba&rsquo;s birthday mag &#128214; &mdash; tap the bottom-right corner</p>
      <div class="book" id="mag-book">

        <!-- PAGE 7: Final Birthday Message (bottom of stack, last page) -->
        <div class="mag-page" id="mag-page-8" style="z-index:0;">
          <div class="pg">
            <div class="art-wrap"><img src="final-page.png" alt="Final birthday message for Dad"></div>
            <span class="back-to-cover" id="finalPageBack" onclick="resetBook()">&#8635; back to cover</span>
          </div>
        </div>

        <!-- PAGE 6: Favourite Songs -->
        <div class="mag-page" id="mag-page-7" style="z-index:1;">
          <div class="pg">
            <div class="art-wrap" id="songsWrap">
              <img src="Page 6 Fav songs.jpg" alt="Dad's favourite songs">
<button class="hotspot" data-src="Chori_chori_sapno_mein_web.mp3" data-title="Chori Chori Sapno Mein" style="left:31.45%; top:47.9%;" aria-label="Play Chori Chori Sapno Mein"><span class="ring"></span></button>
<button class="hotspot" data-src="Woh_Kagaz_Ki_Kashti_web.mp3" data-title="Woh Kagaz Ki Kashti" style="left:70.1%; top:47.85%;" aria-label="Play Woh Kagaz Ki Kashti"><span class="ring"></span></button>
<button class="hotspot" data-src="O_Mehbooba_web.mp3" data-title="O Mehbooba" style="left:31.05%; top:80.2%;" aria-label="Play O Mehbooba"><span class="ring"></span></button>
<button class="hotspot" data-src="Mere_Rang_Mein_Rangne_Wali_web.mp3" data-title="Mere Rang Mein Rangne Wali" style="left:69.7%; top:80.2%;" aria-label="Play Mere Rang Mein Rangne Wali"><span class="ring"></span></button>
            </div>
            <span class="back-to-cover" onclick="resetBook()">&#8635; back to cover</span>
            <div class="page-corner" onclick="turnMagPage(7)"></div>
          </div>
        </div>

        <!-- PAGE 5: Generations of Friendship -->
        <div class="mag-page" id="mag-page-5" style="z-index:3;">
          <div class="pg">
            <div class="art-wrap"><img src="generations-page.png" alt="Generations of Friendship Together"></div>
            <div class="page-corner" onclick="turnMagPage(5)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

        <!-- PAGE 6: Favourite Movies -->
        <div class="mag-page" id="mag-page-6" style="z-index:2;">
          <div class="pg">
            <div class="art-wrap"><img src="favourite-movies-page.png" alt="Dad's favourite movies"></div>
              <img src="favourite-movies-page.png" alt="Dad's favourite movies" style="position:absolute; inset:0; width:100%; height:100%; object-fit:fill; z-index:1;">
            <video id="movieClip" src="movie-clip_sbRZ82s0.mp4" playsinline onclick="if(this.paused){this.play();document.getElementById('moviePlayButton').style.display='none';}else{this.pause();document.getElementById('moviePlayButton').style.display='flex';}" onended="document.getElementById('moviePlayButton').style.display='flex';" style="position:absolute; top:76.2%; left:36.5%; transform:translate(-50%,-50%); width:61.6%; aspect-ratio:2.35/1; object-fit:cover; z-index:4;"></video>
            <button type="button" id="moviePlayButton" onclick="document.getElementById('movieClip').play();this.style.display='none';" aria-label="Play movie" style="position:absolute; top:76.2%; left:36.5%; transform:translate(-50%,-50%); width:14%; aspect-ratio:1/1; border:2px solid #fff; border-radius:50%; background:rgba(0,0,0,.55); color:#fff; font-size:clamp(18px,4vw,42px); line-height:1; padding-left:.14em; cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center;">&#9654;</button>
            <button type="button" onclick="const v=document.getElementById('movieClip');if(v.requestFullscreen){v.requestFullscreen();}else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();}" aria-label="Fullscreen movie" style="position:absolute; top:91%; left:7%; transform:translate(-50%,-50%); width:7%; aspect-ratio:1/1; border:0; border-radius:4px; background:rgba(0,0,0,.55); color:#fff; font-size:clamp(14px,3vw,30px); line-height:1; cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center;">&#9974;</button>
            <div class="pageno">&mdash; 05 &mdash;</div>
            <div class="page-corner" onclick="turnMagPage(6)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

        <!-- PAGE 4: The Letter -->
        <div class="mag-page" id="mag-page-4" style="z-index:4;">
          <div class="pg">
            <div class="art-wrap"><img src="Page 4 short letter.jpg" alt="To the man I call Dad"></div>
            <div class="pageno">&mdash; 04 &mdash;</div>
            <div class="page-corner" onclick="turnMagPage(4)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

        <!-- PAGE 3: Memory Lane -->
        <div class="mag-page" id="mag-page-3" style="z-index:5;">
          <div class="pg">
            <div class="art-wrap"><img src="Page 3 memory_lane.jpg" alt="Daddy's life stories"></div>
            <div class="pageno">&mdash; 03 &mdash;</div>
            <div class="page-corner" onclick="turnMagPage(3)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

        <!-- PAGE 2 -->
        <div class="mag-page" id="mag-page-2" style="z-index:6;">
          <div class="pg">
            <div class="art-wrap"><img src="Page 2.jpg" alt="Happy Birthday Dad message"></div>
            <div class="pageno">&mdash; 02 &mdash;</div>
            <div class="page-corner" onclick="turnMagPage(2)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

        <!-- PAGE 1: Cover (top of stack) -->
        <div class="mag-page mag-cover" id="mag-page-1" style="z-index:7;">
          <div class="pg">
            <img src="Cover Page_Page_1.jpg" alt="Happy Birthday cover" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:4;">
            <div class="art-wrap"><img src="Cover Page_Page_1.jpg" alt="Happy Birthday - Collector's Edition cover"></div>
            <div class="page-corner" onclick="turnMagPage(1)"></div>
            <div class="mag-page-shade"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<div class="now-playing" id="nowPlaying">
  <div class="eq"><i></i><i></i><i></i></div>
  <span id="nowPlayingText">Song</span>
</div>
<audio id="player" preload="none"></audio>

<script>
  function turnMagPage(n){
    const pageEl = document.getElementById('mag-page-'+n);
    if(!pageEl) return;
    if(pageEl.classList.contains('flipped')){
      pageEl.classList.remove('flipped');
    } else {
      pageEl.classList.add('flipped');
    }
    const hint = document.getElementById('magHint');
    if (hint) hint.classList.add('hide');
  }

  function resetBook(){
    for (let n=1; n<=7; n++){
      const pageEl = document.getElementById('mag-page-'+n);
      if (pageEl) pageEl.classList.remove('flipped');
    }
    const player = document.getElementById('player');
    player.pause();
    document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('playing'));
    document.getElementById('nowPlaying').classList.remove('show');
  }

  // --- song playback ---
  const player = document.getElementById('player');
  const nowPlaying = document.getElementById('nowPlaying');
  const nowPlayingText = document.getElementById('nowPlayingText');
  const hotspots = Array.from(document.querySelectorAll('.hotspot'));
  let activeBtn = null;

  function stopAll(){
    hotspots.forEach(h => h.classList.remove('playing'));
    nowPlaying.classList.remove('show');
    activeBtn = null;
  }

  // Large base64 audio data-URIs assigned directly to <audio src> play unreliably
  // (or not at all) on several mobile browsers. Converting to a real Blob object
  // URL the first time each song is tapped fixes that, and is still fully
  // synchronous with the click so autoplay permission is preserved.
  const blobUrlCache = {};
  function getBlobUrl(dataUri, key){
    if (!dataUri.startsWith('data:')) return new URL(dataUri, document.baseURI).href;
    if (blobUrlCache[key]) return blobUrlCache[key];
    const comma = dataUri.indexOf(',');
    const mime = dataUri.substring(5, comma).split(';')[0];
    const binary = atob(dataUri.substring(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
    blobUrlCache[key] = url;
    return url;
  }

  hotspots.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const title = btn.dataset.title;

      if (activeBtn === btn && !player.paused){
        player.pause();
        stopAll();
        return;
      }

      const url = getBlobUrl(btn.dataset.src, title);
      if (player.src !== url){
        player.src = url;
        player.load();
      }
      player.currentTime = 0;
      player.play().catch(err => console.warn('playback failed:', err));

      hotspots.forEach(h => h.classList.remove('playing'));
      btn.classList.add('playing');
      activeBtn = btn;
      nowPlayingText.textContent = title;
      nowPlaying.classList.add('show');
    });
  });

  player.addEventListener('ended', stopAll);
  nowPlaying.addEventListener('click', () => {
    if (!player.paused){ player.pause(); stopAll(); }
  });
</script>
</body>
</html>
